<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0705">
<title>La Frankbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Width of the artwork column: full width on phones, capped on tablets. */
    --w: min(100vw, 640px);
    --ink: #fbe9cf;
    --ember: #ffb347;
    --fire: #ff5a1f;
  }
  * { box-sizing: border-box; }
  html { background: #1a0705; }
  html, body {
    margin: 0; color: var(--ink);
    font-family: "Alegreya Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body { min-height: 100vh; }

  /* ---- Background ------------------------------------------------------
     The artwork is shown at full width from the top so the painted title is
     never cropped. A blurred, darkened copy fills whatever space is left
     around it (below on phones, on the sides on tablets). */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #1a0705; }
  .bg-blur {
    position: absolute; inset: -40px;
    background: url("background.jpg") center / cover no-repeat;
    filter: blur(20px) brightness(.55) saturate(1.2);
  }
  .bg-art {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: var(--w); aspect-ratio: 1086 / 1448;
    background: url("background.jpg") top center / 100% auto no-repeat;
    -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
  }
  /* Darken gently below the title so the buttons have something calmer to sit on. */
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      transparent 0,
      transparent calc(var(--w) * .37),
      rgba(12, 3, 2, .25) calc(var(--w) * .55),
      rgba(12, 3, 2, .45) 100%);
  }

  /* ---- Layout ---------------------------------------------------------- */
  main {
    width: var(--w); margin: 0 auto;
    padding: 0 14px calc(96px + env(safe-area-inset-bottom));
  }
  .title-gap { height: calc(var(--w) * .37); margin: 0; } /* keeps "La Frankbox" clear */

  #status {
    margin: 0 auto 12px; width: fit-content; max-width: 100%;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(15, 4, 2, .7); color: #f3d9b4;
    font-size: .95rem; font-weight: 700; text-align: center;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #status[hidden] { display: none; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

  /* ---- Buttons: smoked glass so the art shows through but text stays crisp */
  .clip {
    position: relative; min-height: 72px; padding: 12px 14px;
    border: 1px solid rgba(255, 190, 110, .28); border-radius: 12px;
    background: rgba(18, 6, 4, .55);
    -webkit-backdrop-filter: blur(8px) saturate(1.3); backdrop-filter: blur(8px) saturate(1.3);
    box-shadow: inset 0 1px 0 rgba(255, 220, 160, .12), 0 4px 14px rgba(0, 0, 0, .35);
    color: var(--ink); text-shadow: 0 1px 2px rgba(0, 0, 0, .85);
    font: inherit; font-size: 1.1rem; font-weight: 800; line-height: 1.15; text-align: left;
    cursor: pointer; overflow: hidden; touch-action: manipulation; user-select: none;
    transition: transform .08s, background-color .15s, box-shadow .15s, border-color .15s;
  }
  .clip:active { transform: scale(.97); background: rgba(60, 18, 8, .65); }
  .clip.loading { opacity: .5; }
  .clip.error { border-color: #e0533a; opacity: .7; }
  .clip.playing {
    border-color: var(--ember); background: rgba(70, 20, 6, .62);
    box-shadow: 0 0 0 1px var(--ember), 0 0 20px rgba(255, 110, 30, .55);
  }
  .clip .bar {
    position: absolute; left: 0; bottom: 0; height: 4px; width: 0;
    background: linear-gradient(90deg, var(--fire), #ffc04d);
  }

  /* ---- Bottom control bar: reload + stop ------------------------------- */
  .controls {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom));
    width: calc(var(--w) - 28px); display: flex; gap: 10px;
  }
  #refresh {
    flex: none; width: 60px; height: 60px; border-radius: 14px;
    border: 1px solid rgba(255, 190, 110, .3);
    background: rgba(15, 4, 2, .6); color: #f3d9b4;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    font-size: 1.5rem; line-height: 1; cursor: pointer; touch-action: manipulation;
  }
  #stop {
    flex: 1; height: 60px;
    border: 1px solid rgba(255, 170, 120, .35); border-radius: 14px;
    background: rgba(150, 25, 15, .8); color: #fff;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    font: inherit; font-size: 1.25rem; font-weight: 800; letter-spacing: .04em;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
    cursor: pointer; touch-action: manipulation;
    opacity: .4; transition: opacity .15s;
  }
  #stop.active { opacity: 1; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="bg-blur"></div><div class="bg-art"></div></div>

<main>
  <h1 class="title-gap" aria-label="La Frankbox"></h1>
  <p id="status">Loading clips…</p>
  <div id="grid"></div>
</main>

<div class="controls">
  <button id="refresh" type="button" aria-label="Reload clips">↻</button>
  <button id="stop" type="button">■ STOP</button>
</div>

<script>
// ---- Settings -------------------------------------------------------------
// On github.io the owner and repo are detected automatically from the URL.
// Fill these in only if detection gets it wrong (e.g. a custom domain).
const CONFIG = {
  owner: "",       // your GitHub username
  repo: "",        // the repository name
  branch: "",      // leave empty to use the repo's default branch
  folder: "clips", // folder (next to index.html) holding the audio files
};
// ---------------------------------------------------------------------------

const AUDIO_EXT = /\.(mp3|m4a|ogg|wav)$/i;
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const stopBtn = document.getElementById("stop");

// Web Audio plays clips without taking over the device's audio focus the way
// a regular <audio> player can, so background music apps keep playing.
const ctx = new (window.AudioContext || window.webkitAudioContext)();
let current = null; // { src, btn, start, duration }

function setStatus(text) {
  statusEl.textContent = text;
  statusEl.hidden = !text;
}

function detectRepo() {
  if (CONFIG.owner && CONFIG.repo) return { owner: CONFIG.owner, repo: CONFIG.repo };
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!m) return null;
  const owner = m[1];
  const first = location.pathname.split("/").filter(Boolean)[0];
  const repo = first && !first.includes(".") ? first : `${owner}.github.io`;
  return { owner, repo };
}

async function listFiles() {
  const r = detectRepo();
  if (r) {
    const ref = CONFIG.branch ? `?ref=${encodeURIComponent(CONFIG.branch)}` : "";
    const url = `https://api.github.com/repos/${r.owner}/${r.repo}/contents/${CONFIG.folder}${ref}`;
    const res = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
    if (res.status === 404) throw new Error(`No "${CONFIG.folder}" folder found in ${r.owner}/${r.repo}.`);
    if (res.status === 403) throw new Error("GitHub's request limit was hit. Wait a few minutes and reload.");
    if (!res.ok) throw new Error(`GitHub API error ${res.status}.`);
    const items = await res.json();
    return items.filter(i => i.type === "file" && AUDIO_EXT.test(i.name)).map(i => i.name);
  }
  // Not on github.io: fall back to an optional clips/list.json (["a.mp3", ...]).
  const res = await fetch(`${CONFIG.folder}/list.json`, { cache: "no-store" });
  if (!res.ok) throw new Error("Can't list clips here. Open the page from its github.io address.");
  return res.json();
}

// "03_The Innkeeper.mp3" -> label "The Innkeeper", sorted 3rd.
// Without a number prefix, clips are sorted alphabetically.
function parseName(file) {
  const base = file.replace(AUDIO_EXT, "");
  const m = base.match(/^(\d+)[\s._-]+(.+)$/);
  return {
    file,
    label: (m ? m[2] : base).replace(/_/g, " ").trim(),
    order: m ? parseInt(m[1], 10) : Infinity,
  };
}

function clearCurrent() {
  if (!current) return;
  current.btn.classList.remove("playing");
  current.btn.querySelector(".bar").style.width = "0";
  current = null;
  stopBtn.classList.remove("active");
}

function stop() {
  if (!current) return;
  const e = current;
  clearCurrent();
  try { e.src.stop(); } catch (_) {}
}

function tick() {
  if (!current) return;
  const p = Math.min(1, (ctx.currentTime - current.start) / current.duration);
  current.btn.querySelector(".bar").style.width = (p * 100) + "%";
  requestAnimationFrame(tick);
}

async function play(btn) {
  if (ctx.state !== "running") await ctx.resume();
  if (!btn._buffer) return;
  if (current && current.btn === btn) { stop(); return; } // tap again to stop
  stop();
  const src = ctx.createBufferSource();
  src.buffer = btn._buffer;
  src.connect(ctx.destination);
  const entry = { src, btn, start: ctx.currentTime, duration: btn._buffer.duration };
  src.onended = () => { if (current === entry) clearCurrent(); };
  src.start();
  current = entry;
  btn.classList.add("playing");
  stopBtn.classList.add("active");
  tick();
}

async function loadBuffer(btn, file) {
  try {
    const res = await fetch(`${CONFIG.folder}/${encodeURIComponent(file)}`);
    if (!res.ok) throw new Error(res.status);
    const data = await res.arrayBuffer();
    btn._buffer = await new Promise((ok, fail) => ctx.decodeAudioData(data, ok, fail));
    btn.classList.remove("loading");
  } catch (err) {
    btn.classList.remove("loading");
    btn.classList.add("error");
    btn.title = "Couldn't load this file";
  }
}

async function load() {
  stop();
  grid.innerHTML = "";
  setStatus("Loading clips…");
  try {
    const clips = (await listFiles()).map(parseName)
      .sort((a, b) => a.order - b.order || a.label.localeCompare(b.label, undefined, { numeric: true }));
    if (!clips.length) {
      setStatus(`No audio files in "${CONFIG.folder}" yet.`);
      return;
    }
    const jobs = clips.map(c => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "clip loading";
      btn.textContent = c.label;
      const bar = document.createElement("span");
      bar.className = "bar";
      btn.appendChild(bar);
      btn.addEventListener("click", () => play(btn));
      grid.appendChild(btn);
      return loadBuffer(btn, c.file);
    });
    await Promise.all(jobs);
    const failed = grid.querySelectorAll(".clip.error").length;
    setStatus(failed ? `${failed} clip(s) failed to load (outlined in red).` : "");
  } catch (err) {
    setStatus(err.message);
  }
}

stopBtn.addEventListener("click", stop);
document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
